name: Real-time News Bot Scraper

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

# Two overlapping runs read the same database, so both decide a story is unsent
# and both broadcast it. Queue runs instead of letting them race.
concurrency:
  group: news-bot-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # db.json is a rolling record of what has been crawled and broadcast, not
      # source. Committing it back every 15 minutes put 1,500+ commits of a
      # multi-megabyte file into the repo's history and made cloning slow.
      # A cache miss is harmless: the bot seeds an empty database silently and
      # starts broadcasting again on the next cycle.
      - name: Restore news database
        uses: actions/cache/restore@v4
        with:
          path: |
            db.json
            subscribers.json
          key: news-db-${{ github.run_id }}
          restore-keys: |
            news-db-

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run news scraper
        run: npm start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SINGLE_RUN: 'true'
          POLL_INTERVAL_MINUTES: 15
          DRY_RUN: 'false'

      # Runs even when the scraper failed: anything already broadcast this cycle
      # must be remembered, or the next run sends it again.
      - name: Count database records
        id: db-check
        if: always()
        run: |
          count=$(node -e "try { console.log(JSON.parse(require('fs').readFileSync('db.json','utf8')).length) } catch (e) { console.log(0) }")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Database holds $count records."

      # Never overwrite a good cache with an empty database from a run that
      # died before it got started.
      - name: Save news database
        if: always() && steps.db-check.outputs.count != '0'
        uses: actions/cache/save@v4
        with:
          path: |
            db.json
            subscribers.json
          key: news-db-${{ github.run_id }}
